[project]
name = "evolvra"
version = "0.1.0"
description = "Core engine for Evolvra: registry, store, provider router, evals, evolution."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Youssef Ghazy" }]
dependencies = []  # zero runtime dependencies on purpose

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
evolvra = "evolvra.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["evolvra"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
