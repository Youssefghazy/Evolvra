name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  core:
    name: core tests + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        working-directory: core
        run: pip install -e ".[dev]"
      - name: Ruff
        working-directory: core
        run: ruff check .
      - name: Pytest
        working-directory: core
        run: pytest -q
      - name: Lint personas (agency-agents frontmatter rules)
        working-directory: core
        run: evolvra lint ../plugin/agents -v

  plugin:
    name: plugin manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JSON
        run: |
          python3 -m json.tool .claude-plugin/marketplace.json > /dev/null
          python3 -m json.tool plugin/.claude-plugin/plugin.json > /dev/null
          python3 -m json.tool plugin/hooks/hooks.json > /dev/null
          python3 -m json.tool plugin/agents/MANIFEST.json > /dev/null
          echo "all manifests valid"

  secrets:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
